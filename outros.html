<!--Modal das equipes-->
<div id="adicionar-equipe" class="modal">
    <div class="modal-conteudo">
        <a href="#" style="float:right; text-decoration:none;">&times;</a>
        <h3>Cadastrar Nova Equipe</h3>
        <form style="margin-top:20px;">
            <div class="form-group"><label>Nome da Equipe</label><input type="text" placeholder="Ex: Equipe Alfa">
            </div>
            <div class="form-group"><label>Integrantes</label><textarea
                    placeholder="Nomes separados por vírgula"></textarea></div>
            <div class="form-group"><label>Contato</label><input type="text" placeholder="(31) 9999-9999"></div>
            <div class="form-group"><label>Região de Atuação</label><input type="text"
                    placeholder="Ex: Cerrado Mineiro"></div>
            <button type="submit" class="btn-salvar">Cadastrar Equipe</button>
        </form>
    </div>
</div>

<!--Vizualização completa das informações-->
<div id="modal-detalhe" class="modal">
    <div class="modal-conteudo">
        <a href="#" style="float:right; text-decoration:none;">&times;</a>
        <h3>Detalhes do Ponto</h3>
        <p>Informações detalhadas aqui...</p>
    </div>
</div>

<!--Confirmar exclusão-->
<div id="alerta-excluir" class="modal">
    <div class="modal-conteudo" style="border-top: 5px solid var(--cor-perigo); text-align:center;">
        <h3>Confirmar Exclusão</h3>
        <p>Tem certeza que deseja apagar este registro?</p>
        <div style="margin-top:20px;">
            <a href="#" class="btn-acao"
                style="background:#eee; color:#333; padding: 10px 20px; border-radius: 4px;">Cancelar</a>
            <a href="#" class="btn-acao btn-excluir"
                style="background: var(--cor-perigo); color: white; padding: 10px 20px; border-radius: 4px;">Sim,
                Excluir</a>
        </div>
    </div>
</div>
